<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Urban Threadz</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <nav class="navbar">
        <a href="index.html" class="logo">
          <span class="urban">Urban</span>
          <span class="threadz">Threadz</span>
        </a>

        <div class="nav-links">
          <a href="index.html" class="active">Home</a>
          <a href="shop.html">Shop</a>
          <a href="cart.html">Cart<span class="cart-count">0</span></a>
          <span id="user-email"></span>
          <a href="login.html" class="login-btn" id="auth-link"></a>

          <button id="theme-toggle" class="theme-toggle" type="button">
            ☀️
          </button>
        </div>
      </nav>
    </header>

    <main class="hero">
      <div class="hero-content">
        <h1>Style That Speaks For You</h1>
        <p>Discover trendy streetwear designed for everyday confidence.</p>
        <a href="shop.html" class="shop-btn"> Shop Now </a>
      </div>
    </main>

    <section class="categories">
      <h2>Shop By Category</h2>

      <div class="category-container">
        <a href="shop.html?category=Jackets" class="category-card">
          <h3>JACKETS</h3>
        </a>

        <a href="shop.html?category=T-Shirts" class="category-card">
          <h3>T-SHIRTS</h3>
        </a>

        <a href="shop.html?category=Shoes" class="category-card">
          <h3>SHOES</h3>
        </a>

        <a href="shop.html?category=Accessories" class="category-card">
          <h3>ACCESSORIES</h3>
        </a>
      </div>
    </section>

    <script type="module" src="app.js"></script>
    <script type="module" src="auth.js"></script>
  </body>
</html>
